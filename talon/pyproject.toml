[project]
name = "talon-agent"
version = "1.0.0"
description = "TALON - Secure autonomous agent, OpenClaw replacement"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "qdrant-client>=1.9",
  "redis>=5",
  "wasmtime>=15",
  "opentelemetry-api",
  "httpx>=0.27",
  "python-multipart",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest","pytest-asyncio","mypy","ruff","httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
